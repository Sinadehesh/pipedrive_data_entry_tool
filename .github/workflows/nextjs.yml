steps:
- name: Checkout repository
  uses: actions/checkout@v4

- name: Set up Node.js
  uses: actions/setup-node@v4
  with:
    node-version: '20'
    cache: 'npm'

- name: Install dependencies
  run: npm ci

- name: Run Linter
  run: npm run lint

- name: Build Next.js App
  run: npm run build
  env:
    # Stub environment variables so the Next.js build doesn't fail in CI.
    # Real secrets will live in Vercel.
    DATABASE_URL: "postgres://dummy:dummy@localhost:5432/dummy"
    DATABASE_URL_RLS: "postgres://dummy:dummy@localhost:5432/dummy"
    AUTH_SECRET: "dummy_secret_for_ci_build_only_12345678"
    ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
